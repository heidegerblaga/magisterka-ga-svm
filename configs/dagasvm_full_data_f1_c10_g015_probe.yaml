algorithm_mode: dagasvm
seed: 43
experiment_name: "dagasvm_full_data_f1_c10_g015_probe"
data:
  train_csv: "data/raw/train.csv"
  validation_csv: "data/raw/validation.csv"
  test_csv: "data/raw/test.csv"
  target: "label"
  stratify: true
  header: false
  target_candidates: ["target", "y", "class"]
  max_rows: null

svm:
  kernel: "rbf"
  C: 10.0
  gamma: 0.15
  class_weight: "balanced"
  probability: false

encoding:
  k_per_class: 100

fitness:
  metric: f1
  class_imbalance_penalty: 0.0

ga:
  population_size: 40
  generations: 20
  tournament_k: 3
  crossover_rate: 0.8
  mutation_rate: 0.05
  elitism: 2
  early_stopping:
    patience: 5
    min_delta: 0.001

val_ga:
  subset_fraction: 0.5
  population_size: 40
  generations: 20
  tournament_k: 3
  crossover_rate: 0.8
  mutation_rate: 0.05
  elitism: 2
  early_stopping:
    patience: 5
    min_delta: 0.001

k_schedule:
  num_cycles: 3
  k_start: 100
  k_multiplier: 1.5

val_cumulation:
  initial_fraction: 0.5
