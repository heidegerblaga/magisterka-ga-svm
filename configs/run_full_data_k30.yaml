seed: 43
experiment_name: "ga_svm_full_data_k30"
data:
  train_csv: "data/raw/train.csv"
  validation_csv: "data/raw/validation.csv"
  test_csv: "data/raw/test.csv"
  target: "label"
  stratify: true
  header: null
  target_candidates: ["target", "y", "class"]
  max_rows: null

svm:
  kernel: "rbf"
  C: 1.0
  gamma: "scale"
  class_weight: "balanced"

encoding:
  k_per_class: 50

fitness:
  metric: balanced_accuracy
  class_imbalance_penalty: 0.2

ga:
  population_size: 40
  generations: 20
  tournament_k: 3
  crossover_rate: 0.8
  mutation_rate: 0.05
  elitism: 2
  early_stopping:
    patience: 5
    min_delta: 0.001

val_ga:
  subset_fraction: 0.5
  population_size: 40
  generations: 20
  tournament_k: 3
  crossover_rate: 0.8
  mutation_rate: 0.05
  elitism: 2
  early_stopping:
    patience: 5
    min_delta: 0.001

k_schedule:
  num_cycles: 3
  k_start: 30
  k_multiplier: 1.5
