seed: 42
experiment_name: followup_phase_switch_template_digits_rand_switch_seed42
dataset_name: Digits (64 cechy)
algorithm_mode: dagasvm_phase_switch
artifacts_root: artifacts/followup_phase_switch/template/digits/rand_switch
data:
  train_csv: data/followup_stop_rule/split_2026/digits/train.csv
  validation_csv: data/followup_stop_rule/split_2026/digits/validation.csv
  test_csv: data/followup_stop_rule/split_2026/digits/test.csv
  target: label
  stratify: true
  header: true
  target_candidates:
  - target
  - y
  - class
  max_rows: 0
svm:
  kernel: rbf
  C: 100.0
  gamma: 0.002
  class_weight: balanced
  probability: false
  standardize: false
fitness:
  metric: balanced_accuracy
  tprime_metric: balanced_accuracy
  vprime_metric: balanced_accuracy
  class_imbalance_penalty: 0.0
ga:
  population_size: 30
  generations: 30
  tournament_k: 3
  crossover_rate: 0.8
  mutation_rate: 0.05
  elitism: 2
  early_stopping:
    patience: 3
    min_delta: 0.0001
daga:
  k_start: 5
  TSV: 0.25
  Ts: 3
  phase_min_delta: 0.0005
phase_switch:
  vprime_increment_per_class: 10
  max_vprime_fraction: 0.25
  max_vprime_rows: null
  vprime_difficulty_min_delta: 0.01
  vprime_difficulty_patience: 2
  vprime_difficulty_window: 2
  vprime_min_difficulty: 0.0
  max_vprime_expansions_per_phase: 10
  max_no_improvement_k_increases: 3
  fitness_min_delta: 0.0005
  allow_one_vprime_retry_after_t_stall: true
  k_growth_requires_sv_signal: true
  warm_start_tprime: true
  ga_stop_at_perfect: true
  representative: best_on_final_vprime
  max_cycles: 300
vprime:
  selection: random
  memory: true
  mode: growing
val_ga:
  population_size: 30
  generations: 20
  tournament_k: 3
  crossover_rate: 0.8
  mutation_rate: 0.1
  elitism: 2
observation:
  full_validation: true
  test: true
followup:
  study: followup_phase_switch
  series: template
  split_seed: 2026
  dataset: digits
  variant: rand_switch
  phase_switch_overrides: {}
