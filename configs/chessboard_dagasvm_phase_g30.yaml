seed: 42
experiment_name: "chessboard_dagasvm_phase_g30"
dataset_name: "Chessboard"
algorithm_mode: "dagasvm_phase"

data:
  train_csv: "data/raw/train.csv"
  validation_csv: "data/raw/validation.csv"
  test_csv: "data/raw/test.csv"
  target: "label"
  stratify: true
  header: false
  target_candidates: ["target", "y", "class"]
  max_rows: 0

svm:
  kernel: "rbf"
  C: 10.0
  gamma: 0.002
  class_weight: "balanced"
  probability: false
  standardize: false

fitness:
  metric: balanced_accuracy
  class_imbalance_penalty: 0.0

ga:
  population_size: 30
  generations: 30
  tournament_k: 3
  crossover_rate: 0.8
  mutation_rate: 0.05
  elitism: 2
  early_stopping:
    patience: 3
    min_delta: 0.0001

daga:
  k_start: 10
  TSV: 0.25
  Ts: 3
  phase_min_delta: 0.0005
  sv_ratio_stability_epsilon: 0.02
  sv_ratio_saturation_margin: 0.15
  val_selection_strategy: heuristic
