seed: 42
experiment_name: study_magic_rand_fixed
dataset_name: MAGIC Gamma (UCI)
algorithm_mode: dagasvm_phase
artifacts_root: artifacts/study/magic/rand_fixed
data:
  train_csv: data/study/magic/train.csv
  validation_csv: data/study/magic/validation.csv
  test_csv: data/study/magic/test.csv
  target: label
  stratify: true
  header: true
  target_candidates:
  - target
  - y
  - class
  max_rows: 0
svm:
  kernel: rbf
  C: 10.0
  gamma: 0.05
  class_weight: balanced
  probability: false
  standardize: false
fitness:
  metric: balanced_accuracy
  class_imbalance_penalty: 0.0
ga:
  population_size: 30
  generations: 30
  tournament_k: 3
  crossover_rate: 0.8
  mutation_rate: 0.05
  elitism: 2
  early_stopping:
    patience: 3
    min_delta: 0.0001
daga:
  k_start: 10
  TSV: 0.25
  Ts: 3
  phase_min_delta: 0.0005
  sv_ratio_stability_epsilon: 0.02
  sv_ratio_saturation_margin: 0.15
vprime:
  selection: random
  memory: true
  mode: fixed
  fixed_size: null
val_ga:
  population_size: 30
  generations: 20
  tournament_k: 3
  crossover_rate: 0.8
  mutation_rate: 0.1
  elitism: 2
observation:
  full_validation: true
  test: true
