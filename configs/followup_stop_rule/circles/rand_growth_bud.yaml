  min_vprime_per_class: 50
  perfect_recheck_expansions: 1
  perfect_recheck_min_add_per_class: 50
vprime:
  selection: random
  memory: true
  mode: growing
  pool_budget_factor: 10.0
val_ga:
  population_size: 30
  generations: 20
  tournament_k: 3
  crossover_rate: 0.8
  mutation_rate: 0.1
  elitism: 2
observation:
  full_validation: true
  test: true
followup:
  study: followup_stop_rule
  split_seed: 2026
  dataset: circles
  variant: rand_growth_bud
  stop_rule: extended
