seed: 42
experiment_name: followup_stop_rule_s2026_circles_rand_growth_bud_seed42
dataset_name: Circles
algorithm_mode: dagasvm_phase
artifacts_root: artifacts/followup_stop_rule/split_2026/circles/rand_growth_bud
data:
  train_csv: data/followup_stop_rule/split_2026/circles/train.csv
  validation_csv: data/followup_stop_rule/split_2026/circles/validation.csv
  test_csv: data/followup_stop_rule/split_2026/circles/test.csv
  target: label
  stratify: true
  header: true
  target_candidates:
  - target
  - y
  - class
